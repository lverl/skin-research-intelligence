services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: skin_research
      POSTGRES_USER: skin
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U skin -d skin_research']
      interval: 5s
      timeout: 5s
      retries: 20
  worker:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgresql://skin:${POSTGRES_PASSWORD}@postgres:5432/skin_research
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
  web:
    build: .
    command: [python, main.py, web]
    env_file: .env
    environment:
      DATABASE_URL: postgresql://skin:${POSTGRES_PASSWORD}@postgres:5432/skin_research
    ports: ['127.0.0.1:8000:8000']
    depends_on:
      postgres:
        condition: service_healthy
  bot:
    build: .
    command: [python, main.py, bot]
    env_file: .env
    environment:
      DATABASE_URL: postgresql://skin:${POSTGRES_PASSWORD}@postgres:5432/skin_research
    depends_on:
      postgres:
        condition: service_healthy
volumes:
  pgdata:
