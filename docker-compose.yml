services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: skin_research
      POSTGRES_USER: skin
      POSTGRES_PASSWORD: ${SERVICE_PASSWORD_POSTGRES}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U skin -d skin_research']
      interval: 5s
      timeout: 5s
      retries: 20
  worker:
    build: .
    environment:
      DATABASE_URL: postgresql://skin:${SERVICE_PASSWORD_POSTGRES}@postgres:5432/skin_research
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      MODEL: ${MODEL:-}
      MODEL_MONTHLY_USD: ${MODEL_MONTHLY_USD:-0}
      MODEL_CALL_RESERVE_USD: ${MODEL_CALL_RESERVE_USD:-1}
      EXA_API_KEY: ${EXA_API_KEY:-}
      EXA_MONTHLY_USD: ${EXA_MONTHLY_USD:-0}
      EXA_SCOPE_USD: ${EXA_SCOPE_USD:-0}
      EXA_PRICING_DATE: ${EXA_PRICING_DATE:-}
      EXA_SEARCH_UPPER_USD: ${EXA_SEARCH_UPPER_USD:-0}
      EXA_CONTENTS_UPPER_USD: ${EXA_CONTENTS_UPPER_USD:-0}
      EXA_MAX_RESULTS: ${EXA_MAX_RESULTS:-5}
      EXA_MAX_CONTENTS: ${EXA_MAX_CONTENTS:-3}
      DIGEST_TIMEZONE: ${DIGEST_TIMEZONE:-Europe/Moscow}
      DIGEST_HOUR: ${DIGEST_HOUR:-19}
      NCBI_API_KEY: ${NCBI_API_KEY:-}
      OPENFDA_API_KEY: ${OPENFDA_API_KEY:-}
      MFDS_API_KEY: ${MFDS_API_KEY:-}
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
  bot:
    build: .
    command: [python, main.py, bot]
    environment:
      DATABASE_URL: postgresql://skin:${SERVICE_PASSWORD_POSTGRES}@postgres:5432/skin_research
      TELEGRAM_TOKEN: ${TELEGRAM_TOKEN:-}
      TELEGRAM_CHAT_IDS: ${TELEGRAM_CHAT_IDS:-}
      WEBAPP_URL: ${WEBAPP_URL:-${SERVICE_URL_WEB_8000:-}/miniapp}
      OWNER_TELEGRAM_ID: ${OWNER_TELEGRAM_ID:-}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      MODEL: ${MODEL:-}
      MODEL_MONTHLY_USD: ${MODEL_MONTHLY_USD:-0}
      MODEL_CALL_RESERVE_USD: ${MODEL_CALL_RESERVE_USD:-1}
      EXA_API_KEY: ${EXA_API_KEY:-}
      EXA_MONTHLY_USD: ${EXA_MONTHLY_USD:-0}
      EXA_SCOPE_USD: ${EXA_SCOPE_USD:-0}
      EXA_PRICING_DATE: ${EXA_PRICING_DATE:-}
      EXA_SEARCH_UPPER_USD: ${EXA_SEARCH_UPPER_USD:-0}
      EXA_CONTENTS_UPPER_USD: ${EXA_CONTENTS_UPPER_USD:-0}
      EXA_MAX_RESULTS: ${EXA_MAX_RESULTS:-5}
      EXA_MAX_CONTENTS: ${EXA_MAX_CONTENTS:-3}
      NCBI_API_KEY: ${NCBI_API_KEY:-}
      OPENFDA_API_KEY: ${OPENFDA_API_KEY:-}
      MFDS_API_KEY: ${MFDS_API_KEY:-}
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
  web:
    build: .
    command: [python, main.py, web]
    environment:
      DATABASE_URL: postgresql://skin:${SERVICE_PASSWORD_POSTGRES}@postgres:5432/skin_research
      PORT: '8000'
      TELEGRAM_TOKEN: ${TELEGRAM_TOKEN:-}
      OWNER_TELEGRAM_ID: ${OWNER_TELEGRAM_ID:-}
      SERVICE_URL_WEB_8000: /miniapp
      WEBAPP_URL: ${WEBAPP_URL:-${SERVICE_URL_WEB_8000:-}/miniapp}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      MODEL: ${MODEL:-}
      MODEL_MONTHLY_USD: ${MODEL_MONTHLY_USD:-0}
      MODEL_CALL_RESERVE_USD: ${MODEL_CALL_RESERVE_USD:-1}
      EXA_API_KEY: ${EXA_API_KEY:-}
      EXA_MONTHLY_USD: ${EXA_MONTHLY_USD:-0}
      EXA_SCOPE_USD: ${EXA_SCOPE_USD:-0}
      EXA_PRICING_DATE: ${EXA_PRICING_DATE:-}
      EXA_SEARCH_UPPER_USD: ${EXA_SEARCH_UPPER_USD:-0}
      EXA_CONTENTS_UPPER_USD: ${EXA_CONTENTS_UPPER_USD:-0}
      EXA_MAX_RESULTS: ${EXA_MAX_RESULTS:-5}
      EXA_MAX_CONTENTS: ${EXA_MAX_CONTENTS:-3}
      NCBI_API_KEY: ${NCBI_API_KEY:-}
      OPENFDA_API_KEY: ${OPENFDA_API_KEY:-}
      MFDS_API_KEY: ${MFDS_API_KEY:-}
    expose: ['8000']
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
volumes:
  pgdata:
